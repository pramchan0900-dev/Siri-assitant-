<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey Siri</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#000;color:#fff;
 font-family:Arial,sans-serif;display:flex;flex-direction:column;
 align-items:center;justify-content:center;text-align:center
}
h1{font-size:30px;font-weight:500;margin-bottom:55px}
.orb{
 width:190px;height:190px;border-radius:50%;
 background:conic-gradient(#55eaff,#6875ff,#d66bff,#ff6da9,#6af5d1,#55eaff);
 box-shadow:0 0 30px #57cfff88,0 0 70px #9366ff55;
 animation:glow 3s infinite alternate
}
@keyframes glow{
 from{transform:scale(.96);filter:brightness(.9)}
 to{transform:scale(1.04);filter:brightness(1.2)}
}
p{color:#aaa;margin-top:45px}
button{
 margin-top:18px;width:68px;height:68px;border-radius:50%;
 border:1px solid #444;background:#191919;color:white;font-size:27px
}
</style>
</head>
<body>
<h1>Hey Siri</h1>
<div class="orb"></div>
<p id="status">How can I help you?</p>
<button onclick="speak()">🎙</button>
<script>
function speak(){
 if(!("speechSynthesis" in window)){
  document.getElementById("status").textContent=
  "Voice is not supported in this browser.";
  return;
 }
 const msg=new SpeechSynthesisUtterance(
  "Namaste! Main aapki kya madad kar sakti hoon?"
 );
 msg.lang="hi-IN";
 speechSynthesis.cancel();
 speechSynthesis.speak(msg);
}
 function listen() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    document.getElementById("status").textContent =
      "Chrome mein voice recognition support nahi hai.";
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  document.getElementById("status").textContent = "Suno, main sun rahi hoon...";
  recognition.start();

  recognition.onresult = function(event) {
    const words = event.results[0][0].transcript;
    document.getElementById("status").textContent = words;

    const answer = new SpeechSynthesisUtterance(
      "Aapne kaha " + words + ". Main aapki baat sun rahi hoon."
    );
    answer.lang = "hi-IN";
    speechSynthesis.speak(answer);
  };

  recognition.onerror = function() {
    document.getElementById("status").textContent =
      "Microphone permission check karo.";
  };
 }
</script>
</body>
</html>
